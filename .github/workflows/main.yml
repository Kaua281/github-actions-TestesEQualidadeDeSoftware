name: Testes da Calculadora

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  testes:
    name: Executar testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verificar versão do Java
        run: |
          java -version
          javac -version

      - name: Compilar código
        run: |
          mkdir -p target/classes

          javac -d target/classes \
            src/main/Calculadora.java \
            src/test/CalculadoraTest.java

      - name: Executar testes
        run: |
          java -cp target/classes CalculadoraTest

      - name: Testes concluídos
        if: success()
        run: echo "Todos os testes foram executados com sucesso!"

      - name: Testes falharam
        if: failure()
        run: echo "Um ou mais testes falharam."